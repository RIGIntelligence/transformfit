name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  flutter:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup nvm and Node 22.22.3
        shell: bash
        run: |
          export NVM_DIR="$HOME/.nvm"
          mkdir -p "$NVM_DIR"
          curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
          source "$NVM_DIR/nvm.sh"
          nvm install 22.22.3
          nvm use 22.22.3
          node --version

      - name: Setup Flutter 3.44.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable

      - name: Export Flutter PATH
        shell: bash
        run: |
          echo "$(dirname "$(which flutter)")" >> "$GITHUB_PATH"
          flutter --version

      # ── Harness Tier-1 lint steps (M2) ────────────────────────────────────
      # Each referenced script exists in the repo and runs locally.
      - name: Doctrine lint (Tier-1)
        shell: bash
        run: |
          source "$HOME/.nvm/nvm.sh"
          export PATH="$(dirname "$(which flutter)"):$PATH"
          python3 transformfit-harness/doctrine_lint.py transformfit-harness/samples/clean_message.md

      - name: Message rule lint (Tier-1)
        shell: bash
        run: |
          source "$HOME/.nvm/nvm.sh"
          export PATH="$(dirname "$(which flutter)"):$PATH"
          python3 transformfit-harness/message_rule_lint.py transformfit-harness/samples/clean_message.md

      - name: Design lint (Tier-1)
        shell: bash
        run: |
          source "$HOME/.nvm/nvm.sh"
          export PATH="$(dirname "$(which flutter)"):$PATH"
          bash transformfit-harness/design_lint.sh transformfit-harness/samples/design_clean.json

      - name: Design token 3-way match (Tier-1)
        shell: bash
        run: |
          source "$HOME/.nvm/nvm.sh"
          export PATH="$(dirname "$(which flutter)"):$PATH"
          bash transformfit-harness/design_lint.sh --verify-tokens

      # ── Build + test gate (Tier-1) ────────────────────────────────────────
      - name: Flutter pub get
        shell: bash
        run: |
          source "$HOME/.nvm/nvm.sh"
          export PATH="$(dirname "$(which flutter)"):$PATH"
          flutter pub get

      - name: Build + test gate (Tier-1: flutter analyze + flutter test)
        shell: bash
        run: |
          source "$HOME/.nvm/nvm.sh"
          export PATH="$(dirname "$(which flutter)"):$PATH"
          bash transformfit-harness/build_test_gate.sh

      # ── Ship gate (HARD-AND over all Tier-1 gates + ProofPacket seal) ─────
      - name: Ship gate (HARD-AND Tier-1 + seal ProofPacket)
        shell: bash
        run: |
          source "$HOME/.nvm/nvm.sh"
          export PATH="$(dirname "$(which flutter)"):$PATH"
          bash transformfit-harness/ship_gate.sh

      # ── Web build (M0 skeleton target) ────────────────────────────────────
      - name: Flutter build web
        shell: bash
        run: |
          source "$HOME/.nvm/nvm.sh"
          export PATH="$(dirname "$(which flutter)"):$PATH"
          flutter build web
