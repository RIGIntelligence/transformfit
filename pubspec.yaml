name: transformfit
description: "TransformFit Flutter Web — assistance-based workout coaching."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.12.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.0
  go_router: ^14.6.2
  drift: ^2.22.0
  supabase_flutter: ^2.9.1
  sqlite3_flutter_libs: ^0.5.26
  meta: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.22.0

flutter:
  uses-material-design: true
  fonts:
    - family: Playfair
      fonts:
        - asset: assets/fonts/PlayfairDisplay-VariableFont_wght.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
    # The Flutter web engine hardcodes "Roboto" as its internal fallback font
    # and fetches it from fonts.gstatic.com at runtime, even when every app
    # widget resolves to a bundled family (Flutter issue #163554). The only
    # endorsed way to stop that third-party fetch is to register a local
    # "Roboto" family. We alias it to the bundled Inter variable font so the
    # engine's Roboto fallback resolves to a same-origin asset that is already
    # loaded for the Inter family (no extra download, zero gstatic requests),
    # preserving the bundled-fonts-only contract: only Playfair + Inter .ttf
    # are ever fetched, all from the app's own origin.
    - family: Roboto
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
